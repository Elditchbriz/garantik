name: Build Android APK

on:
  workflow_dispatch: # se lance manuellement depuis l'onglet "Actions" de GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: garantik-react
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Java (requis par Gradle/Android)
        uses: actions/setup-java@v5
        id: setup-java
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Installer les dépendances du projet
        run: npm install

      - name: Installer Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/browser @capacitor/app

      - name: Installer l'outil de génération d'icônes
        run: npm install @capacitor/assets --save-dev

      - name: Préparer le dossier assets/ attendu par l'outil
        run: |
          mkdir -p assets
          cp icon.png assets/icon.png
          cp splash.png assets/splash.png
          ls -la assets/

      - name: Construire l'app web
        run: npm run build

      - name: Ajouter la plateforme Android (crée le dossier android/)
        run: npx cap add android

      - name: Corriger le conflit connu de versions kotlin-stdlib
        run: |
          echo "
          allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }" >> android/build.gradle

      - name: Vérifier que le correctif est bien en place
        run: tail -10 android/build.gradle

      - name: Ajouter le schéma de retour pour l'authentification (Google, email)
        run: |
          python3 << 'PYEOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              content = f.read()

          intent_filter = '''        <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="fr.heydid.app" android:host="callback" />
              </intent-filter>
          </activity>'''

          if "</activity>" in content:
              content = content.replace("</activity>", intent_filter, 1)
              with open(path, "w") as f:
                  f.write(content)
              print("Schéma d'URL ajouté avec succès")
          else:
              print("ATTENTION : balise </activity> non trouvée, rien d'inséré")
          PYEOF

      - name: Vérifier le manifeste corrigé
        run: cat android/app/src/main/AndroidManifest.xml

      - name: Générer les icônes et le splash screen
        run: npx capacitor-assets generate --android

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Vérifier la version Java active
        run: java -version

      - name: Compiler l'APK Android (debug, non signé)
        working-directory: garantik-react/android
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}
        run: chmod +x ./gradlew && ./gradlew assembleDebug -Dorg.gradle.java.home="${{ steps.setup-java.outputs.path }}"

      - name: Récupérer l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: hey-did-debug-apk
          path: garantik-react/android/app/build/outputs/apk/debug/app-debug.apk
