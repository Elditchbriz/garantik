
name: Prepare iOS project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Add iOS platform if needed
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          else
            echo "The iOS platform already exists."
          fi

      - name: Synchronize iOS project
        run: npx cap sync ios

      - name: Commit generated iOS project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f ios package-lock.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add generated Capacitor iOS project"
            git push origin HEAD
          fi
