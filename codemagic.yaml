
workflows:
  hey-did-ios:
    name: Hey Did - iOS unsigned build
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies and build web app
        script: |
          cd "$CM_BUILD_DIR/garantik-react"
          npm ci
          npm run build

      - name: Synchronize Capacitor iOS
        script: |
          cd "$CM_BUILD_DIR/garantik-react"
          npx cap sync ios

      - name: Build iOS application without signing
        script: |
          cd "$CM_BUILD_DIR/garantik-react"

          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        script: |
          cd "$CM_BUILD_DIR/garantik-react"

          APP_PATH="ios/build/Build/Products/Release-iphoneos/App.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: App.app not found"
            exit 1
          fi

          mkdir -p "$CM_BUILD_DIR/artifacts/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/artifacts/Payload/"

          cd "$CM_BUILD_DIR/artifacts"
          ditto -c -k --sequesterRsrc --keepParent Payload Hey-Did-unsigned.ipa

    artifacts:
      - artifacts/*.ipa
      - /tmp/xcodebuild_logs/*.log
