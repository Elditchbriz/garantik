<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion en cours…</title>
  <style>
    body {
      margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F8FAFD; color: #1B2430;
    }
    .msg { text-align: center; }
    .spinner {
      width: 32px; height: 32px; border: 3px solid #EEF4FF; border-top-color: #2962FF;
      border-radius: 50%; margin: 0 auto 16px; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="msg">
    <div class="spinner"></div>
    <p>Connexion en cours, retour à l'application…</p>
  </div>
  <script>
    // Cette page ne sert qu'à relayer la redirection vers l'app native.
    // Chrome fait confiance à une vraie page https pour déclencher ensuite
    // une navigation vers un schéma personnalisé (fr.heydid.app://...) —
    // une redirection DIRECTE depuis Google vers ce schéma s'est révélée
    // peu fiable sur Android.
    var hash = window.location.hash || '';
    var search = window.location.search || '';
    window.location.href = 'fr.heydid.app://callback' + search + hash;
  </script>
</body>
</html>
