<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light">
  <title>Hey Did : impossible de se connecter</title>
  <!--
    Page de secours de l'application Android (réglage « server.errorPath » de capacitor.config.json).
    L'application ouvre https://www.hey-did.fr en direct : quand le site ne peut pas se charger (pas de réseau, service indisponible),
    Android affiche cette page, embarquée dans l'application, au lieu d'un écran vide.
    Autonome volontairement : aucun fichier, police ni script externe (elle doit s'afficher précisément quand rien ne se charge).
    Écrite en JavaScript simple (ES5) pour fonctionner aussi sur d'anciens WebView.
  -->
  <style>
    :root { --navy: #1B2430; --blue: #2962FF; --blue-dark: #1E4FD6; --blue-pale: #F5F9FF; --bg: #F8FAFD; --ink-soft: #6C7383; --ink-faint: #94A3B8; --line: #E2E8F0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--navy); }
    body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; -webkit-text-size-adjust: 100%; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
           padding: calc(32px + env(safe-area-inset-top, 0px)) 24px calc(32px + env(safe-area-inset-bottom, 0px)); }
    .logo { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 36px; }
    .logo span { color: var(--blue); }
    .icon { width: 84px; height: 84px; border-radius: 50%; background: var(--blue-pale); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; margin-bottom: 24px; }
    .icon svg { width: 38px; height: 38px; stroke: var(--blue); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    h1 { font-size: 22px; line-height: 1.3; font-weight: 800; margin: 0 0 12px; letter-spacing: -0.01em; }
    h1, #message, .reassure { text-wrap: balance; }   /* évite un mot orphelin sur la dernière ligne (ignoré par les anciens WebView, sans conséquence) */
    p { margin: 0; }
    #message { font-size: 15px; line-height: 1.6; color: var(--ink-soft); max-width: 340px; margin-bottom: 28px; }
    button { appearance: none; -webkit-appearance: none; font: inherit; font-size: 15px; font-weight: 700; color: #fff; background: var(--blue); border: 0; border-radius: 14px;
             padding: 15px 22px; width: 100%; max-width: 320px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:active { background: var(--blue-dark); }
    button:focus-visible { outline: 3px solid rgba(41, 98, 255, .35); outline-offset: 2px; }
    button[disabled] { opacity: .7; cursor: default; }
    .reassure { font-size: 12.5px; line-height: 1.55; color: var(--ink-faint); max-width: 300px; margin-top: 22px; }
  </style>
</head>
<body>
  <main>
    <div class="logo">Hey <span>Did</span></div>
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/></svg>
    </div>
    <h1>Impossible de charger Hey&nbsp;Did</h1>
    <p id="message" role="status" aria-live="polite"></p>
    <button id="retry" type="button">Réessayer</button>
    <p class="reassure">Vos garanties, contrats et documents sont en sécurité : vous les retrouverez dès que la connexion sera rétablie.</p>
  </main>
  <script>
    (function () {
      var TARGET = 'https://www.hey-did.fr/';
      var message = document.getElementById('message');
      var button = document.getElementById('retry');
      var waiting = false;

      // Deux cas : pas de réseau du tout, ou réseau présent mais le site ne répond pas pour le moment.
      function describe() {
        message.textContent = (navigator.onLine === false)
          ? 'Hey Did a besoin d\u2019une connexion internet. Vérifiez votre Wi-Fi ou vos données mobiles, puis réessayez.'
          : 'Vous semblez connecté à internet, mais Hey Did ne répond pas pour le moment. Réessayez dans un instant.';
      }

      function retry() {
        if (waiting) return;
        waiting = true;
        button.disabled = true;
        button.textContent = 'Nouvelle tentative\u2026';
        window.location.replace(TARGET);
        // Si la navigation n'a pas lieu (ou échoue et revient ici), on rend la main au bout de quelques secondes.
        setTimeout(function () { waiting = false; button.disabled = false; button.textContent = 'Réessayer'; describe(); }, 5000);
      }

      describe();
      button.addEventListener('click', retry);
      window.addEventListener('online', retry);     // la connexion revient : on recharge tout seul
      window.addEventListener('offline', describe);
    })();
  </script>
</body>
</html>
